<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Organizer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <h1>Tab Organizer</h1>
          <p id="summary">Loading...</p>
        </div>
        <button id="refreshButton" class="iconButton" title="Refresh" type="button">R</button>
      </header>

      <section class="actions" aria-label="Actions">
        <button id="groupButton" type="button">Group inactive</button>
        <button id="closeButton" class="danger" type="button">Close group</button>
        <button id="mergeGroupsButton" type="button">Merge duplicate groups</button>
      </section>

      <section class="domainRules" aria-label="Domain rules">
        <button id="saveDomainRuleButton" type="button">Always use this group for domain</button>
        <p id="domainRuleStatus"></p>
        <ul id="domainRuleList" class="ruleList"></ul>
      </section>

      <section class="excludedUrls" aria-label="Excluded URLs">
        <h2>Auto-group URL exclusions</h2>
        <p>Excluded URLs are not grouped or deduplicated. URL paths are matched by prefix.</p>
        <div class="excludedUrlForm">
          <input
            id="excludedUrlInput"
            type="url"
            placeholder="https://safelinks.example/"
            autocomplete="off"
          >
          <button id="addExcludedUrlButton" type="button">Add</button>
        </div>
        <p id="excludedUrlStatus" role="status"></p>
        <ul id="excludedUrlList" class="ruleList"></ul>
      </section>

      <section class="list" aria-label="Inactive tabs">
        <div id="emptyState" class="empty" hidden>No inactive tabs grouped.</div>
        <ul id="tabList"></ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
